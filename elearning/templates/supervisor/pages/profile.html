{% extends "supervisor/base.html" %}
{% load static %}
{% block main %}

    <!-- Content Header (Page header) -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0">Dashboard</h1>
                </div><!-- /.col -->
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="#">Supervisors</a></li>
                        <li class="breadcrumb-item active">Το Προφίλ μου</li>
                    </ol>
                </div><!-- /.col -->
            </div><!-- /.row -->
        </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12 col-12">
                    <div class="card card-primary card-outline">
                        <div class="card-header bg-primary text-white">
                            <h3 class="card-title"><i class="fas fa-user-circle"></i> Το Προφίλ μου</h3>
                        </div>

                        <div class="card-body">
                            <form id="profileForm">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label>Όνομα Χρήστη</label>
                                    <input type="text" class="form-control" value="{{ user.username }}" readonly>
                                </div>

                                <div class="form-group">
                                    <label>Όνομα</label>
                                    <input type="text" name="name" id="name" class="form-control"
                                        value="{{ supervisor.name|default:'' }}">
                                </div>

                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" name="email" id="email" class="form-control"
                                        value="{{ user.email }}">
                                </div>

                                <div class="form-group">
                                    <label>Τμήμα</label>
                                    <input type="text" name="department" id="department" class="form-control"
                                        value="{{ supervisor.department|default:'' }}">
                                </div>

                                <div class="form-group">
                                    <label>Τηλέφωνο</label>
                                    <input type="text" name="phone" id="phone" class="form-control"
                                        value="{{ supervisor.phone|default:'' }}">
                                </div>

                                <button type="submit" class="btn btn-success btn-block mt-3">
                                    <i class="fas fa-save"></i> Αποθήκευση Αλλαγών
                                </button>
                            </form>

                            <button class="btn btn-warning btn-block mt-3 text-white" id="openPasswordModal">
                                <i class="fas fa-key"></i> Αλλαγή Κωδικού
                            </button>

                            <div id="messageBox" class="mt-3"></div>
                        </div>
                        <!-- 🔑 Modal Αλλαγής Κωδικού -->
                        <div class="modal fade" id="passwordModal" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header bg-warning text-white">
                                        <h5 class="modal-title"><i class="fas fa-key"></i> Αλλαγή Κωδικού</h5>
                                        <button type="button" class="close text-white"
                                            data-dismiss="modal">&times;</button>
                                    </div>
                                    <div class="modal-body">
                                        <form id="passwordForm">
                                            {% csrf_token %}
                                            <div class="form-group">
                                                <label>Νέος Κωδικός</label>
                                                <input type="password" id="new_password" class="form-control" required
                                                    minlength="6">
                                            </div>
                                            <div class="form-group">
                                                <label>Επιβεβαίωση Κωδικού</label>
                                                <input type="password" id="confirm_password" class="form-control"
                                                    required minlength="6">
                                            </div>
                                        </form>
                                        <div id="passwordMessage"></div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-secondary" data-dismiss="modal">Άκυρο</button>
                                        <button class="btn btn-warning text-white" id="savePasswordBtn">Αλλαγή</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

{% endblock main%}

{% block script_new %}
<script>
$(function(){
  // Αποθήκευση προφίλ
  $('#profileForm').on('submit', function(e){
    e.preventDefault();
    $.ajax({
      url: "{% url 'supervisor:profile' %}",
      method: 'POST',
      data: $(this).serialize(),
      success: function(resp){
        if(resp.success){
          $('#messageBox').html('<div class="alert alert-success">'+resp.message+'</div>');
        } else {
          $('#messageBox').html('<div class="alert alert-danger">Σφάλμα κατά την αποθήκευση.</div>');
        }
      }
    });
  });

  // Άνοιγμα modal αλλαγής κωδικού
  $('#openPasswordModal').on('click', function(){
    $('#passwordModal').modal('show');
  });

  // Αλλαγή κωδικού
  $('#savePasswordBtn').on('click', function(){
    const newPass = $('#new_password').val();
    const confirmPass = $('#confirm_password').val();

    if(newPass !== confirmPass){
      $('#passwordMessage').html('<div class="alert alert-danger">Οι κωδικοί δεν ταιριάζουν.</div>');
      return;
    }

    $.post("{% url 'supervisor:change_own_password' %}", {
      new_password: newPass,
      csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val()
    }, function(resp){
      if(resp.success){
        $('#passwordModal').modal('hide');
        $('#messageBox').html('<div class="alert alert-success">'+resp.message+'</div>');
      } else {
        $('#passwordMessage').html('<div class="alert alert-danger">'+resp.error+'</div>');
      }
    });
  });
});
</script>
{% endblock script_new %}
