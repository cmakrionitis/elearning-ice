{% extends "supervisor/base.html" %}
{% load static %}
{% block main %}

    <!-- Content Header (Page header) -->
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 class="m-0">Dashboard</h1>
                </div><!-- /.col -->
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="#">Supervisors</a></li>
                        <li class="breadcrumb-item active">Create Supervisor</li>
                    </ol>
                </div><!-- /.col -->
            </div><!-- /.row -->
        </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12 col-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">➕ Δημιουργία Επόπτη</h3>
                        </div>
                        <div class="card-body">
                            <form id="formCreate" action="{% url 'supervisor:create_supervisor' %}" method="POST">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label>Username</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label>Password</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label>Όνομα</label>
                                    <input type="text" name="name" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" name="email" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label>Τμήμα</label>
                                    <input type="text" name="department" class="form-control" required>
                                </div>

                                <div class="form-group">
                                    <label>Τηλέφωνο</label>
                                    <input type="text" name="phone" class="form-control">
                                </div>

                                <div class="form-group">
                                    <div class="icheck-primary">
                                        <input type="checkbox" id="is_active" name="is_active" checked>
                                        <label for="is_active">Ενεργός</label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success btn-block">Αποθήκευση</button>
                            </form>
                        </div>
                    </div>
                    <div id="messageBox" class="mt-3"></div>
                </div>
            </div>
        </div>
    </section>

{% endblock main%}

{% block script_new %}
<script>
    $(function () {
        // Κάνει τη φόρμα γενική (δουλεύει για κάθε <form>)
        $('form').on('submit', function (e) {
            e.preventDefault();

            const form = $(this);
            const url = form.attr('action');  // ✅ παίρνει το action δυναμικά

            // Δημιουργούμε data object για checkbox, select κλπ.
            const formData = {};

            form.find('input, select, textarea').each(function () {
                const name = $(this).attr('name');
                const type = $(this).attr('type');

                if (!name) return; // skip αν δεν έχει name

                if (type === 'checkbox') {
                    formData[name] = $(this).is(':checked') ? 'on' : ''; // checked / unchecked
                } else {
                    formData[name] = $(this).val();
                }
            });

            // ✅ AJAX γενικό
            $.ajax({
                url: url,
                method: "POST",
                data: formData,
                headers: { 'X-CSRFToken': $('input[name=csrfmiddlewaretoken]').val() },
                success: function (response) {
                    if (response.success) {
                        $('#messageBox').html(
                            '<div class="alert alert-success">' + response.message + '</div>'
                        );
                        form[0].reset();
                    } else {
                        let errors = '';
                        for (let field in response.errors) {
                            errors += '<p><strong>' + field + ':</strong> ' + response.errors[field][0] + '</p>';
                        }
                        $('#messageBox').html(
                            '<div class="alert alert-danger">' + errors + '</div>'
                        );
                    }
                },
                error: function () {
                    $('#messageBox').html('<div class="alert alert-danger">Σφάλμα κατά την αποθήκευση.</div>');
                }
            });
        });
    });
</script>
{% endblock script_new %}
